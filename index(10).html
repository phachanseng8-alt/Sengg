<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// ຄ່າ Supabase ເກົ່າ (ໂປຣເຈັກເດີມ ຮັກສາຂໍ້ມູນເກົ່າ)
const SUPABASE_URL = 'https://rznfokqpifuzdlhszvzf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3V9hrnpil3u-8mp265Diww_Dc_jPnGa';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');
const lak = n => fmt(n) + ' LAK';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = s => new Date(s).toLocaleString('en-GB', {dateStyle:'short', timeStyle:'short'});
const PROVINCES = ['ນະຄອນຫຼວງວຽງຈັນ','ຜົ້ງສາລີ','ຫຼວງນ້ຳທາ','ອຸດົມໄຊ','ບໍ່ແກ້ວ','ຫຼວງພະບາງ','ຫົວພັນ','ໄຊຍະບູລີ','ຊຽງຂວາງ','ວຽງຈັນ','ບໍລິຄຳໄຊ','ຄຳມ່ວນ','ສະຫວັນນະເຂດ','ສາລະວັນ','ເຊກອງ','ຈຳປາສັກ','ອັດຕະປື','ໄຊສົມບູນ'];
const ST = {pending:'ລໍຖ້າ', paid:'ຊຳລະແລ້ວ', shipped:'ກຳລັງຈັດສົ່ງ', done:'ສຳເລັດ', cancelled:'ຍົກເລີກ'};
const ERR = {not_logged_in:'ກະລຸນາເຂົ້າສູ່ລະບົບ', insufficient_balance:'ຍອດເງິນບໍ່ພໍ ກະລຸນາເຕີມເງິນ', out_of_stock:'ສິນຄ້າບາງລາຍການສະຕັອກບໍ່ພໍ', product_unavailable:'ສິນຄ້າບາງລາຍການບໍ່ພ້ອມຂາຍ', address_required:'ກະລຸນາຕື່ມທີ່ຢູ່ຈັດສົ່ງໃຫ້ຄົບ', phone_required:'ກະລຸນາໃສ່ເບີໂທ', bad_company:'ບໍລິສັດຂົນສົ່ງບໍ່ຖືກຕ້ອງ', empty_cart:'ຕະກ້າຫວ່າງ'};
const errMsg = m => { const k = Object.keys(ERR).find(k => (m||'').includes(k)); return k ? ERR[k] : 'ເກີດຂໍ້ຜິດພາດ ກະລຸນາລອງໃໝ່'; };

const S = {user:null, uid:null, profile:null, products:[], cats:[], banners:[], store:null, ships:[], cat:'all', q:'', method:'shipping', company:null};
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let CART = load('nagi_cart');   // [{id, qty}] — ລາຄາບໍ່ເກັບ, ດຶງຈາກ DB ທຸກຄັ້ງ
let WISH = load('nagi_wish');   // ເກັບໃນເຄື່ອງ (localStorage) ເທົ່ານັ້ນ

function toast(t, ok){
  const el = $('toast'); el.textContent = t;
  el.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-lg text-sm text-white shadow-lg ' + (ok ? 'bg-green-600' : 'bg-red-500');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 3500);
}
function openSheet(title, html){ $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheet').classList.remove('hidden'); $('sheet').classList.add('flex'); }
function closeSheet(){ $('sheet').classList.add('hidden'); $('sheet').classList.remove('flex'); }
const prod = id => S.products.find(p => p.id == id);

/* ---------- Theme ---------- */
function applyThemeIcon(){ $('themeIcon').className = 'fa-solid ' + (document.documentElement.classList.contains('dark') ? 'fa-sun' : 'fa-moon'); }
function toggleTheme(){ const d = document.documentElement.classList.toggle('dark'); try { localStorage.setItem('nagi_theme', d ? 'dark' : 'light'); } catch {} applyThemeIcon(); }

/* ---------- ຂໍ້ມູນ ---------- */
async function loadAll(){
  const [p, c, b, s, sh] = await Promise.all([
    sb.from('products').select('*').order('id', {ascending:false}),
    sb.from('categories').select('*').eq('active', true).order('sort'),
    sb.from('banners').select('*').order('sort').order('id'),
    sb.from('store_settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('shipping_companies').select('*').eq('active', true).order('sort')
  ]);
  if (p.error) { $('sections').innerHTML = '<p class="text-center text-red-500 text-sm py-10">ໂຫຼດສິນຄ້າບໍ່ໄດ້ ກະລຸນາລອງໃໝ່</p>'; return; }
  S.products = (p.data || []).filter(x => x.active);
  S.cats = c.error ? [] : (c.data || []);          // ຖ້າຍັງບໍ່ໄດ້ຮັນ migration => fallback
  S.banners = (b.data || []).filter(x => x.active);
  S.store = s.error ? null : s.data;
  S.ships = sh.error ? [] : (sh.data || []);
  render();
}
const catNames = () => S.cats.length ? S.cats.map(c => c.name) : [...new Set(S.products.map(p => p.game).filter(Boolean))];
const catIcon = n => S.cats.find(c => c.name === n)?.icon || 'fa-microchip';

function badgeOf(p){
  if (p.stock < 1) return ['ໝົດ','bg-gray-500'];
  if (p.old_price && p.old_price > p.price) return ['Sale','bg-red-500'];
  if (p.badge === 'best') return ['Best Seller','bg-amber-500'];
  if (p.badge === 'new') return ['New','bg-green-500'];
  return null;
}
function card(p, wide){
  const b = badgeOf(p), out = p.stock < 1, w = WISH.includes(p.id);
  const off = p.old_price > p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0;
  return `<div class="${wide ? 'w-44 shrink-0 md:w-52' : ''} bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden flex flex-col">
    <div class="relative aspect-square bg-gray-100 dark:bg-slate-700 cursor-pointer" data-view="${p.id}">
      <img loading="lazy" src="${esc(p.image_url) || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%23e5e7eb%22/%3E%3C/svg%3E'}" class="w-full h-full object-contain p-2" alt="${esc(p.name)}">
      ${b ? `<span class="absolute top-2 left-2 ${b[1]} text-white text-[10px] font-bold px-2 py-0.5 rounded">${b[0]}${off && b[0]==='Sale' ? ' -'+off+'%' : ''}</span>` : ''}
      <button aria-label="ມັກ" data-wish="${p.id}" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 dark:bg-slate-800/90 ${w?'text-red-500':'text-gray-400'}"><i class="fa-${w?'solid':'regular'} fa-heart"></i></button>
    </div>
    <div class="p-3 flex flex-col flex-grow">
      <p class="text-[11px] text-gray-400 truncate">${esc([p.brand, p.model].filter(Boolean).join(' · ') || p.game)}</p>
      <h3 class="text-sm font-semibold line-clamp-2 min-h-[2.5rem]">${esc(p.name)}</h3>
      <div class="mt-1"><span class="text-brand font-bold">${lak(p.price)}</span>${p.old_price > p.price ? `<div class="text-xs text-gray-400 line-through">${lak(p.old_price)}</div>` : ''}</div>
      <p class="text-[11px] mt-1 ${out ? 'text-red-500' : 'text-green-600'}">${out ? 'ສິນຄ້າໝົດ' : 'ມີສິນຄ້າ · ເຫຼືອ ' + p.stock}</p>
      <div class="mt-2 grid grid-cols-2 gap-2 mt-auto pt-2">
        <button data-view="${p.id}" class="border border-brand text-brand rounded-lg py-1.5 text-xs font-semibold">ລາຍລະອຽດ</button>
        <button ${out ? 'disabled' : ''} data-add="${p.id}" class="${out ? 'bg-gray-300' : 'bg-brand'} text-white rounded-lg py-1.5 text-xs font-semibold"><i class="fa-solid fa-cart-plus"></i> ຕະກ້າ</button>
      </div>
    </div></div>`;
}
function section(title, icon, list, carousel){
  if (!list.length) return '';
  return `<section><h2 class="font-bold text-lg mb-3"><i class="fa-solid ${icon} text-brand mr-1"></i>${title}</h2>` +
    (carousel ? `<div class="flex gap-3 overflow-x-auto snap pb-2">${list.map(p => card(p, true)).join('')}</div>`
              : `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">${list.map(p => card(p)).join('')}</div>`) + '</section>';
}
function render(){
  const pill = (v, t, ic) => `<button data-cat="${esc(v)}" class="${S.cat===v?'bg-brand text-white':'bg-gray-100 dark:bg-slate-700'} px-4 py-1.5 rounded-full text-sm whitespace-nowrap">${ic ? `<i class="fa-solid ${ic} mr-1"></i>` : ''}${esc(t)}</button>`;
  $('pills').innerHTML = pill('all', 'ທັງໝົດ', 'fa-border-all') + catNames().map(n => pill(n, n, catIcon(n))).join('');
  $('bannerWrap').classList.toggle('hidden', !S.banners.length || S.q || S.cat !== 'all');
  $('banners').innerHTML = S.banners.map(b => `<div data-ban="${b.id}" class="relative shrink-0 w-[88%] md:w-[48%] h-32 md:h-44 rounded-2xl overflow-hidden text-white flex items-center p-5 bg-gradient-to-r from-brand to-indigo-600 cursor-pointer" ${b.image_url ? `style="background-image:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05)),url('${esc(b.image_url)}');background-size:cover;background-position:center"` : ''}><div><p class="text-xs font-semibold">${esc(b.subtitle)}</p><h2 class="text-xl md:text-3xl font-black">${esc(b.title)}</h2></div></div>`).join('');
  const q = S.q.toLowerCase();
  const filtered = S.products.filter(p => (S.cat === 'all' || p.game === S.cat) && [p.name, p.brand, p.model, p.game].join(' ').toLowerCase().includes(q));
  if (S.q || S.cat !== 'all') {
    $('sections').innerHTML = filtered.length ? `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">${filtered.map(p => card(p)).join('')}</div>` : '<p class="text-center text-gray-400 py-10 text-sm">ບໍ່ພົບສິນຄ້າ</p>';
  } else {
    const L = S.products;
    $('sections').innerHTML = (L.length ? '' : '<p class="text-center text-gray-400 py-10 text-sm">ຍັງບໍ່ມີສິນຄ້າໃນຮ້ານ</p>') +
      section('ສິນຄ້າແນະນຳ', 'fa-star', L.filter(p => p.featured), true) +
      section('ສິນຄ້າຂາຍດີ', 'fa-fire', L.filter(p => p.badge === 'best').concat([...L].sort((a,b) => (b.sold_count||0) - (a.sold_count||0)).filter(p => p.sold_count > 0 && p.badge !== 'best')).slice(0, 8), false) +
      section('ສິນຄ້າມາໃໝ່', 'fa-bolt', L.filter(p => p.badge === 'new').concat(L.filter(p => p.badge !== 'new')).slice(0, 8), false) +
      section('ສິນຄ້າລົດລາຄາ', 'fa-tags', L.filter(p => p.old_price > p.price), false);
  }
  updateBadges();
}

/* ---------- ລາຍລະອຽດ / ມັກ ---------- */
function viewSheet(id){
  const p = prod(id); if (!p) return; const out = p.stock < 1;
  openSheet(p.name, `<img src="${esc(p.image_url)}" class="w-full max-h-64 object-contain rounded-xl bg-gray-100 dark:bg-slate-700" alt="">
    <p class="text-xs text-gray-400 mt-3">${esc(p.game)}${p.brand ? ' · ' + esc(p.brand) : ''}${p.model ? ' · ' + esc(p.model) : ''}</p>
    <p class="text-brand font-bold text-2xl">${lak(p.price)}</p>${p.old_price > p.price ? `<p class="text-sm text-gray-400 line-through">${lak(p.old_price)}</p>` : ''}
    <p class="text-sm mt-2 ${out ? 'text-red-500' : 'text-green-600'}">${out ? 'ສິນຄ້າໝົດ' : 'ເຫຼືອ ' + p.stock + ' ອັນ'}</p>
    ${p.description ? `<p class="text-sm mt-3 whitespace-pre-line">${esc(p.description)}</p>` : ''}

/* ---------- ຕະກ້າ ---------- */
function updateBadges(){
  const n = CART.reduce((a, i) => a + i.qty, 0);
  ['cartBadge','cartBadge2'].forEach(k => { $(k).textContent = n; $(k).classList.toggle('hidden', !n); });
}
function addCart(id){
  const p = prod(id); if (!p || p.stock < 1) return toast('ສິນຄ້າໝົດ');
  const it = CART.find(i => i.id == id);
  if (it) { if (it.qty >= p.stock) return toast('ສະຕັອກມີ ' + p.stock + ' ອັນ'); it.qty++; } else CART.push({id: p.id, qty: 1});
  save('nagi_cart', CART); updateBadges(); toast('ເພີ່ມໃສ່ຕະກ້າແລ້ວ', true);
}
function cartLines(){
  CART = CART.filter(i => prod(i.id)); save('nagi_cart', CART);
  return CART.map(i => ({...i, p: prod(i.id)}));
}
function totals(lines){
  const sub = lines.reduce((a, l) => a + (l.p.old_price || l.p.price) * l.qty, 0);
  const pay = lines.reduce((a, l) => a + l.p.price * l.qty, 0);
  const ship = S.method === 'shipping' ? Number(S.ships.find(s => s.id == S.company)?.fee || 0) : 0;
  return {sub, disc: sub - pay, ship, total: pay + ship};
}
function cartSheet(){
  const L = cartLines();
  if (!L.length) return openSheet('ຕະກ້າ', '<p class="text-sm text-gray-400 py-4 text-center">ຕະກ້າຫວ່າງ</p>');
  const t = totals(L);
  openSheet('ຕະກ້າສິນຄ້າ', L.map(l => `<div class="flex gap-3 py-3 border-b dark:border-slate-700">
      <img src="${esc(l.p.image_url)}" class="w-16 h-16 rounded-lg object-contain bg-gray-100 dark:bg-slate-700" alt="">
      <div class="flex-1 text-sm"><b class="line-clamp-2">${esc(l.p.name)}</b><div class="text-brand font-semibold">${lak(l.p.price)}</div>
        <div class="flex items-center gap-2 mt-1"><button data-qty="${l.id}:-1" class="w-7 h-7 border rounded dark:border-slate-600">−</button><span>${l.qty}</span><button data-qty="${l.id}:1" class="w-7 h-7 border rounded dark:border-slate-600">+</button>
        <button data-del="${l.id}" class="ml-auto text-red-500 text-xs"><i class="fa-solid fa-trash"></i> ລຶບ</button></div></div></div>`).join('') +
    `<div class="mt-3 text-sm space-y-1"><div class="flex justify-between"><span>ລາຄາລວມ</span><span>${lak(t.sub)}</span></div>
      <div class="flex justify-between text-green-600"><span>ສ່ວນຫຼຸດ</span><span>-${lak(t.disc)}</span></div>
      <div class="flex justify-between text-gray-400"><span>ຄ່າຈັດສົ່ງ</span><span>ເລືອກຕອນ Checkout</span></div>
      <div class="flex justify-between font-bold text-base pt-1"><span>ຍອດ (ກ່ອນຄ່າສົ່ງ)</span><span class="text-brand">${lak(t.sub - t.disc)}</span></div></div>
    <button data-act="checkout" class="mt-4 w-full bg-brand text-white py-2.5 rounded-xl font-semibold">ໄປໜ້າ Checkout</button>`);
}
function qty(id, d){
  const it = CART.find(i => i.id == id), p = prod(id); if (!it || !p) return;
  it.qty += d; if (it.qty < 1) CART = CART.filter(i => i.id != id); else if (it.qty > p.stock) { it.qty = p.stock; toast('ສະຕັອກມີ ' + p.stock + ' ອັນ'); }
  save('nagi_cart', CART); updateBadges(); cartSheet();
}

  const pick = `

      ${st.phone ? `<p class="text-xs mt-1"><i class="fa-solid fa-phone"></i> ${esc(st.phone)}</p>` : ''}
      ${/^https:\/\//.test(st.map_url || '') ? `<a href="${esc(st.map_url)}" target="_blank" rel="noopener" class="inline-block mt-2 text-brand text-xs underline"><i class="fa-solid fa-map"></i> ເປີດແຜນທີ່ Google Maps</a>` : ''}
      <p class="mt-2 text-xs">${esc(st.pickup_note || 'ລູກຄ້າຕ້ອງມາຮັບສິນຄ້າທີ່ຮ້ານດ້ວຍຕົນເອງ')}</p>
    </div>
    <input id="cPhone" class="inp" inputmode="tel" placeholder="ເບີໂທຕິດຕໍ່ *">`;

async function placeOrder(){
  const btn = $('btnConfirm'), L = cartLines(); if (!L.length) return;
  const phone = $('cPhone').value.trim();
  if (!phone) return toast('ກະລຸນາໃສ່ເບີໂທ');
  let f = {name:null, prov:null, dist:null, addr:null};
  if (S.method === 'shipping') {
    f = {name:$('cName').value.trim(), prov:$('cProv').value, dist:$('cDist').value.trim(), addr:$('cAddr').value.trim()};
    S.company = Number($('cCo').value);
    if (!f.name || !f.prov || !f.dist || !f.addr) return toast('ກະລຸນາຕື່ມຂໍ້ມູນການຈັດສົ່ງໃຫ້ຄົບກ່ອນຊື້');
  }
  btn.disabled = true; btn.textContent = 'ກຳລັງກວດສະຕັອກ ແລະລາຄາ...';
  // ກວດສະຕັອກ + ລາຄາຈາກ DB ອີກຄັ້ງ (server ກວດຊ້ຳໃນ RPC ເຊັ່ນກັນ)
  const ids = L.map(l => l.id);
  const { data: fresh, error: fe } = await sb.from('products').select('id,price,stock,active,name').in('id', ids);
  if (fe) { btn.disabled = false; btn.textContent = 'ຢືນຢັນການສັ່ງຊື້'; return toast('ກວດສອບບໍ່ໄດ້ ກະລຸນາລອງໃໝ່'); }
  const changed = L.filter(l => { const f2 = fresh.find(x => x.id === l.id); return !f2 || !f2.active || f2.stock < l.qty || Number(f2.price) !== Number(l.p.price); });
  if (changed.length) { await loadAll(); btn.disabled = false; toast('ລາຄາ ຫຼື ສະຕັອກມີການປ່ຽນແປງ: ' + changed.map(c => c.p.name).join(', ') + ' — ກະລຸນາກວດຕະກ້າໃໝ່'); return cartSheet(); }
  const { data, error } = await sb.rpc('place_order', { p_items: L.map(l => ({id: l.id, qty: l.qty})), p_method: S.method, p_company: S.method === 'shipping' ? S.company : null, p_name: f.name, p_phone: phone, p_province: f.prov, p_district: f.dist, p_address: f.addr });
  btn.disabled = false; btn.textContent = 'ຢືນຢັນການສັ່ງຊື້';
  if (error) return toast(errMsg(error.message));
  CART = []; save('nagi_cart', CART);
  openSheet('ສັ່ງຊື້ສຳເລັດ', `<p class="text-center text-4xl">✅</p><p class="text-center font-bold mt-2">ອໍເດີ #${esc(data)}</p><p class="text-center text-sm text-gray-500 mt-1">${S.method === 'pickup' ? 'ກະລຸນາມາຮັບສິນຄ້າທີ່ຮ້ານ' : 'ຮ້ານຈະຈັດສົ່ງຜ່ານບໍລິສັດຂົນສົ່ງ'}</p><button data-act="close" class="mt-4 w-full bg-brand text-white py-2.5 rounded-xl">ປິດ</button>`);
  loadProfile(); loadAll();
}

  if (!S.user) { S.profile = null; return updateHeader(); }
  const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = data; updateHeader();
}
function updateHeader(){
  $('btnAuth').textContent = S.profile ? fmt(S.profile.balance) + ' K' : 'ເຂົ້າສູ່ລະບົບ';
  $('btnAuth').dataset.act = S.user ? 'profile' : 'auth';
  $('btnReg').classList.toggle('md:block', !S.user); $('btnReg').classList.toggle('hidden', !!S.user);
}

  openSheet(su ? 'ສະໝັກສະມາຊິກ' : 'ເຂົ້າສູ່ລະບົບ', `

    <input id="aEmail" type="email" class="inp" placeholder="ອີເມວ" autocomplete="email">

    <button data-act="${su?'doSignup':'doLogin'}" class="mt-4 w-full bg-brand text-white py-2.5 rounded-xl font-semibold">${su?'ສະໝັກ':'ເຂົ້າສູ່ລະບົບ'}</button>

async function doLogin(){

  if (error) return toast(/confirm/i.test(error.message) ? 'ຍັງບໍ່ໄດ້ຢືນຢັນອີເມວ' : 'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກ');

async function doSignup(){

const ACT = {
  home: () => { S.cat = 'all'; S.q = ''; $('search').value = $('searchM').value = ''; closeSheet(); render(); window.scrollTo({top:0, behavior:'smooth'}); },
  cats: catsSheet, wish: wishSheet, cart: cartSheet, checkout: checkoutSheet, placeOrder, orders: ordersSheet, profile: profileSheet,

  logout: async () => { await sb.auth.signOut(); closeSheet(); toast('ອອກຈາກລະບົບແລ້ວ', true); }

document.addEventListener('click', e => {
  const t = e.target;
  if (t === $('sheet')) return closeSheet();
  let m;
  if ((m = t.closest('[data-wish]'))) return toggleWish(m.dataset.wish);
  if ((m = t.closest('[data-add]'))) return addCart(m.dataset.add);
  if ((m = t.closest('[data-view]'))) return viewSheet(m.dataset.view);
  if ((m = t.closest('[data-qty]'))) { const [id, d] = m.dataset.qty.split(':'); return qty(id, Number(d)); }
  if ((m = t.closest('[data-del]'))) { CART = CART.filter(i => i.id != m.dataset.del); save('nagi_cart', CART); updateBadges(); return cartSheet(); }
  if ((m = t.closest('[data-method]'))) { S.method = m.dataset.method; return checkoutSheet(); }
  if ((m = t.closest('[data-cat]'))) { S.cat = m.dataset.cat; S.q = ''; closeSheet(); render(); return window.scrollTo({top:0, behavior:'smooth'}); }
  if ((m = t.closest('[data-ban]'))) { const b = S.banners.find(x => x.id == m.dataset.ban), g = catNames().find(n => n.toLowerCase() === String(b?.game || b?.title).toLowerCase()); if (g) { S.cat = g; render(); } return; }
  if ((m = t.closest('[data-nav]'))) { document.querySelectorAll('[data-nav]').forEach(n => { n.classList.toggle('text-brand', n === m); n.classList.toggle('text-gray-400', n !== m); }); return ACT[m.dataset.nav]?.(); }
  if ((m = t.closest('[data-act]')) && ACT[m.dataset.act]) ACT[m.dataset.act]();
});
document.addEventListener('change', e => { if (e.target.id === 'cCo') { S.company = Number(e.target.value); const keep = ['cName','cPhone','cDist','cAddr','cProv'].map(k => [k, $(k)?.value]); checkoutSheet(); keep.forEach(([k, v]) => { if ($(k) && v) $(k).value = v; }); } });
const onSearch = e => { S.q = e.target.value; $('search').value = $('searchM').value = S.q; render(); };
$('search').addEventListener('input', onSearch); $('searchM').addEventListener('input', onSearch);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.matches?.('[role=button]')) e.target.click(); });
sb.auth.onAuthStateChange((ev, session) => {
  const uid = session?.user?.id ?? null, changed = uid !== S.uid;
  S.user = session?.user ?? null; S.uid = uid;
  if (!changed && ev !== 'INITIAL_SESSION') return;
  setTimeout(() => { loadProfile(); loadAll(); }, 0);
});
applyThemeIcon(); updateBadges();
</script>
